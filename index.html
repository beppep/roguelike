<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roguelike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Special+Elite&display=swap">
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<div id="app">
  <header>
    <h1>Roguelike <span>// Corporate Tower</span></h1>
    <div class="spacer"></div>
    <button data-act="god" title="Testing: walk any distance, rest any time without burning cards, infinite creds">God mode: off</button>
    <button data-act="ascend" title="God mode: skip to the lift">Ascend floor</button>
    <button data-act="sound">Sound: on</button>
    <button data-act="restart">Restart floor</button>
  </header>
  <div id="layout">
    <main id="main">
      <div id="viewport"><div id="board"></div><button id="center" data-act="center" title="Centre the view on you (C)">Centre</button><div id="feed"></div></div>
      <div id="bar"></div>
      <div id="hand"></div>
    </main>
    <aside id="side"></aside>
  </div>
</div>
<div id="toast"></div>
<div id="tip" hidden></div>
<div id="modal" hidden></div>

<script src="js/data.js"></script>
<script src="js/content.js"></script>
<script src="js/content-lore.js"></script>
<script src="js/gen.js"></script>
<script src="js/sound.js"></script>
<script src="js/game.js"></script>
</body>
</html>
